[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seldecomp"
dynamic = ["version"]
description = "Raking-based reweighting decomposition of group differences in means"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tom Selden"}, {name = "Thomas A. Hegland"}]
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
plots = ["matplotlib"]

[project.urls]
Repository = "https://github.com/thegland/seldecomp"

[tool.setuptools]
packages = ["seldecomp"]

[tool.setuptools.dynamic]
version = {attr = "seldecomp.__version__"}
